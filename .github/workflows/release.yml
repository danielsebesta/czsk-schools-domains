name: Release & Publish npm

# Push a tag vX.Y.Z (or vX.Y.Z-rc.N) on a commit that is already on main.
# Before the first release:
#   - create the environment "npm" (Settings → Environments) with required reviewers and the secret NPM_TOKEN:
#     an npm granular access token with read and write access and "Bypass 2FA", valid for at most 90 days
#     (npm classic and "Automation" tokens no longer exist);
#   - protect tags v* (Settings → Rules → Rulesets) so that only maintainers can push them.
# After the first publish, set up npm Trusted Publishing (OIDC) for this workflow and delete NPM_TOKEN:
# npm plans to end direct publishing with tokens in January 2027. Trusted publishing needs npm 11.5.1 or newer,
# so the publish job runs on Node.js 24.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and that the commit is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install TypeScript package devDependencies
        working-directory: packages/ts
        run: npm ci --ignore-scripts

      - name: Set version and repository metadata
        working-directory: packages/ts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pkg set repository.type=git "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" \
            repository.directory=packages/ts "homepage=https://github.com/${GITHUB_REPOSITORY}#readme" \
            "bugs.url=https://github.com/${GITHUB_REPOSITORY}/issues"

      - name: Validate data, build ESM+CJS+.d.ts and run tests
        run: |
          cp LICENSE LICENSE-DATA.md README.md THIRD_PARTY_NOTICES.md packages/ts/
          node scripts/validate-pr.mjs --skip-dns

      - name: Pack
        working-directory: packages/ts
        run: npm pack --ignore-scripts && mv czsk-schools-domains-*.tgz ../../package.tgz

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: package.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish czsk-schools-domains to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish ./package.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create GitHub Release with data assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.dist_tag == 'next' }}
          files: |
            data/domains.json
            data/domains.txt
            data/domains-all.json
            data/domains-detailed.json
