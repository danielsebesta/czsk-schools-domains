name: Monthly DNS / MX Audit

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run DNS / MX audit across data/domains-all.json
        run: |
          node scripts/check-mx.mjs \
            --input data/domains-all.json \
            --out dns-audit-report.md \
            --json-out dns-audit-report.json \
            --concurrency 40

      - name: Upload audit report artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-audit-report
          path: |
            dns-audit-report.md
            dns-audit-report.json

      - name: Open or update GitHub Issue for dead domains
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("dns-audit-report.json", "utf8"));
            const { data: labelled } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dns-audit",
            });
            // only touch issues this workflow opened, never ones people filed by hand
            const issues = labelled.filter((i) => i.user?.login === "github-actions[bot]" && !i.pull_request);
            if (!report.dead || report.dead.length === 0) {
              core.info("No dead domains found.");
              for (const issue of issues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Monthly DNS audit found 0 dead domains (${report.total} checked). Closing automatically.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
              return;
            }
            const md = fs.readFileSync("dns-audit-report.md", "utf8");
            const maxChars = 60000;
            const body = md.length > maxChars
              ? md.slice(0, maxChars) + "\n\n... (truncated; download full report from workflow artifacts)"
              : md;
            const title = `Monthly DNS Audit: ${report.dead.length} domain(s) without MX/A/AAAA`;
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
            } else {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: "dns-audit",
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: "dns-audit",
                  color: "d93f0b",
                  description: "Automated monthly DNS/MX domain audit",
                });
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dns-audit"],
              });
            }
